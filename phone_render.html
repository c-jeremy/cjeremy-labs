<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone render</title>
<!-- phone_render.html: the driver for phone_render.mjs. It loads the film page in a hidden frame, then loops: ask the
     server for a frame number, render it with renderAt(), upload the JPEG. Keep this tab in front and the screen on. -->
<style>
  :root { --bg: #1b1820; --fg: #eee; --dim: #9a93a6; --accent: #DC7FA0; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; }
  main { padding: 16px; display: grid; gap: 12px; max-width: 720px; margin: auto; }
  h1 { font-size: 18px; margin: 0; }
  #prev { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; object-fit: contain; }
  .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .dim { color: var(--dim); font-size: 13px; }
  progress { width: 100%; height: 14px; accent-color: var(--accent); }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #1b1820; font-weight: 600; }
  #log { font: 12px ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; max-height: 30vh; overflow: auto; }
  iframe { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; opacity: 0; pointer-events: none; z-index: -1; }
</style>
</head>
<body>
<main>
  <h1 id="title">Phone render</h1>
  <img id="prev" alt="">
  <progress id="bar" value="0" max="1"></progress>
  <div class="row"><span id="stat">loading the film…</span><span id="speed"></span></div>
  <div class="row"><span class="dim" id="gpu"></span><button id="go">Start</button></div>
  <div id="log"></div>
</main>
<script>
const $ = s => document.querySelector(s), id = new URLSearchParams(location.search).get('id');
const log = m => { $('#log').textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + $('#log').textContent.slice(0, 4000); };
$('#title').textContent = `Phone render: ${id}`;
const frame = document.createElement('iframe'); frame.src = `/${id}.html?render`; document.body.appendChild(frame);
let running = false, wake = null;
async function film() {                                        // wait until the film page says it's ready
  for (;;) { const w = frame.contentWindow; if (w && w.ready === true && w.renderAt) return w; await new Promise(r => setTimeout(r, 300)); }
}
film().then(w => { $('#stat').textContent = 'ready'; try { $('#gpu').textContent = 'GPU: ' + w.gpuInfo(); } catch (e) {} });
async function keepAwake() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) { log('no wake lock here (needs localhost or https): set a long screen timeout'); } }
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(); });
$('#go').onclick = async () => {
  if (running) { running = false; $('#go').textContent = 'Start'; return; }
  running = true; $('#go').textContent = 'Pause'; keepAwake();
  const w = await film(); let n = 0, t0 = performance.now(), total = null;
  while (running) {
    let job; try { job = await (await fetch('/next', { cache: 'no-store' })).json(); } catch (e) { log('server unreachable, retrying'); await new Promise(r => setTimeout(r, 3000)); continue; }
    if (job.done) { $('#stat').textContent = 'all frames done ✓'; running = false; $('#go').textContent = 'Start'; break; }
    if (total === null) total = job.left;
    try {
      const url = await w.renderAt(job.t, 'image/jpeg', .94), blob = await (await fetch(url)).blob();
      const r = await fetch(`/frame/${job.i}`, { method: 'POST', body: blob });
      if (!r.ok) throw new Error(await r.text());
      n++; const ms = (performance.now() - t0) / n;
      if (n % 12 === 1) $('#prev').src = url;
      $('#bar').max = total; $('#bar').value = n;
      $('#stat').textContent = `frame ${job.i} (${job.t.toFixed(2)} s) · ${n} done this session`;
      $('#speed').textContent = `${ms.toFixed(0)} ms/frame · ~${((job.left - 1) * ms / 60000).toFixed(0)} min left`;
    } catch (e) { log(`frame ${job.i}: ${e.message || e}`); await new Promise(r => setTimeout(r, 1000)); }
  }
};
</script>
</body>
</html>
